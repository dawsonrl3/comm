<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Vacation Plans — Future Tense Pairwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12232e;
    --navy-2:#1a2e3a;
    --cream:#f3ecd7;
    --cream-2:#faf6ea;
    --coral:#e2624f;
    --coral-dark:#b8483a;
    --gold:#e0a23a;
    --sea:#2f6f77;
    --ink:#22231f;
    --steel:#8fa2ab;
    --good:#3f7d54;
    --bad:#b8483a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy);
    background-image:radial-gradient(ellipse at 15% 0%, rgba(224,162,58,0.12), transparent 55%),
                      radial-gradient(ellipse at 100% 100%, rgba(47,111,119,0.18), transparent 55%);
    color:var(--cream-2);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .display{font-family:'Alfa Slab One',cursive;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* airmail stripe border strip, used as an accent divider */
  .airmail-strip{
    height:8px;width:100%;
    background:repeating-linear-gradient(-45deg,var(--coral) 0 14px, var(--cream) 14px 22px, var(--sea) 22px 36px, var(--cream) 36px 44px);
    opacity:.9;
  }

  /* ---------------- HOME ---------------- */
  #screen-home{align-items:center;justify-content:center;padding:36px 22px;text-align:center;gap:26px;}
  .eyebrow{
    letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--gold);
    border:1px solid rgba(224,162,58,.4);border-radius:999px;padding:5px 14px;
  }
  h1.title{font-size:clamp(30px,8vw,42px);margin:6px 0 4px;line-height:1.05;}
  .subtitle{color:var(--steel);font-size:14.5px;max-width:340px;margin:0 0 6px;line-height:1.5;}
  .role-grid{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px;}
  .role-card{
    background:var(--cream);color:var(--ink);border-radius:10px;padding:20px 18px;text-align:left;
    display:flex;align-items:center;gap:16px;cursor:pointer;border:none;
    box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .12s, box-shadow .12s;
  }
  .role-card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.35);}
  .postmark{
    width:56px;height:56px;border-radius:50%;border:3px solid var(--coral-dark);
    display:flex;align-items:center;justify-content:center;flex:0 0 56px;
    font-family:'Alfa Slab One',cursive;font-size:22px;color:var(--coral-dark);position:relative;
  }
  .postmark::after{content:"";position:absolute;inset:-7px;border:1px dashed var(--coral-dark);border-radius:50%;opacity:.5;}
  .role-copy .role-name{font-family:'Alfa Slab One',cursive;font-size:17px;margin-bottom:2px;}
  .role-copy .role-desc{font-size:12.5px;color:#54544c;}

  /* ---------------- ROLE SCREEN ---------------- */
  #screen-role{padding-bottom:24px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;}
  .you-are{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);}
  .you-badge{
    font-family:'Alfa Slab One',cursive;font-size:15px;color:var(--gold);margin-top:2px;
  }
  .switch-link{background:none;border:none;color:var(--steel);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}

  .tabs{display:flex;gap:8px;padding:6px 20px 0;}
  .tab-btn{
    flex:1;padding:11px 6px;border-radius:8px;border:1px solid rgba(224,162,58,.3);
    background:rgba(255,255,255,.04);color:var(--steel);font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .tab-btn.active{background:var(--cream);color:var(--ink);border-color:var(--cream);}

  .panel{padding:18px 16px 8px;}
  .section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:4px 4px 12px;}

  /* ---- ASK cards ---- */
  .q-card{background:var(--cream);color:var(--ink);border-radius:10px;padding:14px 14px 16px;margin-bottom:14px;}
  .q-num{font-family:'Alfa Slab One',cursive;font-size:13px;color:var(--coral-dark);margin-bottom:8px;}
  .assembly{
    min-height:44px;border:2px dashed #cdbf98;border-radius:8px;background:var(--cream-2);
    padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;
  }
  .word-chip{
    background:var(--navy);color:var(--cream-2);border:none;border-radius:6px;padding:8px 11px;
    font-size:14.5px;font-weight:600;cursor:pointer;
  }
  .word-chip.placed{background:var(--sea);}
  .pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .card-actions{display:flex;gap:8px;}
  .mini-btn{
    flex:1;border:none;border-radius:7px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .mini-btn.check{background:var(--sea);color:#fff;}
  .mini-btn.reveal{background:transparent;border:1px solid #9c9678;color:#6a634a;}
  .feedback{font-size:13px;margin-top:8px;font-weight:600;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .reveal-text{font-size:13.5px;margin-top:8px;font-style:italic;color:#54544c;}

  /* ---- ANSWER flow ---- */
  .listen-box{background:var(--cream);color:var(--ink);border-radius:10px;padding:18px;text-align:center;margin-bottom:16px;}
  .listen-label{font-size:12px;color:var(--coral-dark);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;font-weight:700;}
  .listen-q{font-family:'Alfa Slab One',cursive;font-size:20px;}
  .answer-pool{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .answer-opt{
    background:var(--cream);color:var(--ink);border:none;border-radius:9px;padding:13px 14px;
    font-size:14.5px;text-align:left;cursor:pointer;font-weight:500;
  }
  .answer-opt:active{background:var(--sea);color:#fff;}
  .log-title{font-size:12px;color:var(--steel);letter-spacing:.08em;text-transform:uppercase;margin:6px 4px 8px;}
  .log-item{
    display:flex;gap:10px;background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;
  }
  .log-num{font-family:'Alfa Slab One',cursive;color:var(--gold);}
  .log-item.correct{border-left:4px solid var(--good);}
  .log-item.incorrect{border-left:4px solid var(--bad);}
  .done-box{background:var(--cream);color:var(--ink);border-radius:10px;padding:16px;text-align:center;margin-top:6px;}
  .primary-btn{
    background:var(--coral);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;
    cursor:pointer;width:100%;margin-top:10px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="eyebrow">Future Tense · Going To</div>
    <h1 class="title display">VACATION<br>PLANS</h1>
    <p class="subtitle">Unscramble your questions, ask your partner, and listen carefully to choose the right answer.</p>
    <div class="role-grid">
      <button class="role-card" onclick="chooseRole('A')">
        <div class="postmark">A</div>
        <div class="role-copy">
          <div class="role-name">Partner A</div>
          <div class="role-desc">Asks about Bill · Answers about Sue</div>
        </div>
      </button>
      <button class="role-card" onclick="chooseRole('B')">
        <div class="postmark">B</div>
        <div class="role-copy">
          <div class="role-name">Partner B</div>
          <div class="role-desc">Asks about Sue · Answers about Bill</div>
        </div>
      </button>
    </div>
  </section>

  <!-- ROLE SCREEN -->
  <section id="screen-role" class="screen">
    <div class="airmail-strip"></div>
    <div class="topbar">
      <div>
        <div class="you-are">You are</div>
        <div class="you-badge display">PARTNER <span id="roleLetter"></span></div>
      </div>
      <button class="switch-link" onclick="goHome()">switch role</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabAskBtn" onclick="showTab('ask')">Ask</button>
      <button class="tab-btn" id="tabAnswerBtn" onclick="showTab('answer')">Answer</button>
    </div>

    <div class="panel" id="askPanel"></div>
    <div class="panel" id="answerPanel" style="display:none;"></div>
  </section>

</div>

<script>
/* ================= DATA ================= */
const Q_BILL = [
  ["Where","is","Bill","going","to","go","for","vacation","?"],
  ["When","is","he","going","to","go","?"],
  ["How","long","is","he","going","to","stay","?"],
  ["What","is","he","going","to","do","there","?"],
  ["Who","is","he","going","to","go","with","?"],
  ["Is","he","going","to","stay","at","a","hotel","?"]
];
const Q_SUE = [
  ["Where","is","Sue","going","to","go","for","vacation","?"],
  ["When","is","she","going","to","go","?"],
  ["How","long","is","she","going","to","stay","?"],
  ["What","is","she","going","to","do","there","?"],
  ["Who","is","she","going","to","go","with","?"],
  ["Is","she","going","to","stay","at","a","hotel","?"]
];
const ANSWERS_SUE = [
  "She's going to go to Taiwan for vacation.",
  "She's going to go in August.",
  "She's going to stay for five days.",
  "She's going to take pictures of the Taipei 101 building.",
  "Nobody. She's going to go by herself.",
  "No, she isn't."
];
const ANSWERS_BILL = [
  "He's going to go to Spain for vacation.",
  "He's going to go in September.",
  "He's going to stay for one week.",
  "He's going to watch an FC Barcelona match.",
  "He's going with his mom and dad.",
  "Yes, he is."
];

/* ================= STATE (in-memory) ================= */
let role = null;          // 'A' or 'B'
let askQuestions = [];    // array of {correct:[], pool:[], placed:[]}
let answerBank = [];      // shuffled copy of the answer-set this role must give
let answerCorrectOrder = []; // correct order (index 0..5 = Q1..6)
let answerLog = [];       // {qNum, chosenText, correct:boolean}
let currentQIndex = 0;    // which question (0-5) we're listening for
let remainingAnswers = []; // pool not yet used

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ================= NAV ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ role=null; showScreen('screen-home'); }

function chooseRole(r){
  role = r;
  document.getElementById('roleLetter').textContent = r;

  const qSet = (r === 'A') ? Q_BILL : Q_SUE;
  askQuestions = qSet.map(correct => {
    const pool = shuffle(correct);
    return { correct, pool, placed: [] };
  });

  answerCorrectOrder = (r === 'A') ? ANSWERS_SUE : ANSWERS_BILL;
  remainingAnswers = shuffle(answerCorrectOrder.map((text,i)=>({text, qNum:i+1})));
  answerLog = [];
  currentQIndex = 0;

  showScreen('screen-role');
  showTab('ask');
  renderAsk();
  renderAnswer();
}

function showTab(which){
  document.getElementById('tabAskBtn').classList.toggle('active', which==='ask');
  document.getElementById('tabAnswerBtn').classList.toggle('active', which==='answer');
  document.getElementById('askPanel').style.display = which==='ask' ? 'block' : 'none';
  document.getElementById('answerPanel').style.display = which==='answer' ? 'block' : 'none';
}

/* ================= ASK TAB ================= */
function renderAsk(){
  const label = role === 'A' ? 'Ask about Bill' : 'Ask about Sue';
  const panel = document.getElementById('askPanel');
  let html = `<div class="section-label">${label} — unscramble, then ask your partner</div>`;

  askQuestions.forEach((q, qi) => {
    html += `<div class="q-card" id="qcard-${qi}">
      <div class="q-num">QUESTION ${qi+1}</div>
      <div class="assembly" id="assembly-${qi}"></div>
      <div class="pool" id="pool-${qi}"></div>
      <div class="card-actions">
        <button class="mini-btn check" onclick="checkQuestion(${qi})">Check</button>
        <button class="mini-btn reveal" onclick="revealQuestion(${qi})">Reveal</button>
      </div>
      <div class="feedback" id="feedback-${qi}"></div>
      <div class="reveal-text" id="revealtext-${qi}" style="display:none;"></div>
    </div>`;
  });
  panel.innerHTML = html;
  askQuestions.forEach((q, qi) => renderChips(qi));
}

function renderChips(qi){
  const q = askQuestions[qi];
  const assembly = document.getElementById(`assembly-${qi}`);
  const pool = document.getElementById(`pool-${qi}`);
  assembly.innerHTML = '';
  pool.innerHTML = '';

  q.placed.forEach((word, idx) => {
    const b = document.createElement('button');
    b.className = 'word-chip placed';
    b.textContent = word;
    b.onclick = () => unplaceWord(qi, idx);
    assembly.appendChild(b);
  });

  q.pool.forEach((word, idx) => {
    const b = document.createElement('button');
    b.className = 'word-chip';
    b.textContent = word;
    b.onclick = () => placeWord(qi, idx);
    pool.appendChild(b);
  });
}

function placeWord(qi, idx){
  const q = askQuestions[qi];
  q.placed.push(q.pool[idx]);
  q.pool.splice(idx,1);
  renderChips(qi);
}
function unplaceWord(qi, idx){
  const q = askQuestions[qi];
  q.pool.push(q.placed[idx]);
  q.placed.splice(idx,1);
  renderChips(qi);
}

function buildSentence(arr){
  return arr.join(' ').replace(/ \?/g, '?');
}

function checkQuestion(qi){
  const q = askQuestions[qi];
  const fb = document.getElementById(`feedback-${qi}`);
  const correctStr = buildSentence(q.correct).toLowerCase();
  const placedStr = buildSentence(q.placed).toLowerCase();
  if(q.placed.length !== q.correct.length){
    fb.textContent = 'Not finished yet — place all the words.';
    fb.className = 'feedback bad';
    return;
  }
  if(placedStr === correctStr){
    fb.textContent = '✔ Correct! Ask your partner now.';
    fb.className = 'feedback good';
  } else {
    fb.textContent = '✘ Not quite — check your word order.';
    fb.className = 'feedback bad';
  }
}

function revealQuestion(qi){
  const q = askQuestions[qi];
  const rt = document.getElementById(`revealtext-${qi}`);
  rt.textContent = buildSentence(q.correct);
  rt.style.display = 'block';
}

/* ================= ANSWER TAB ================= */
function renderAnswer(){
  const label = role === 'A' ? 'Answer about Sue' : 'Answer about Bill';
  const panel = document.getElementById('answerPanel');
  panel.innerHTML = `<div class="section-label">${label} — listen, then pick the matching answer</div>
    <div id="listenArea"></div>
    <div class="log-title">Your answers so far</div>
    <div id="answerLogArea"></div>`;
  renderListenArea();
  renderLog();
}

function renderListenArea(){
  const area = document.getElementById('listenArea');
  if(currentQIndex >= 6){
    const correctCount = answerLog.filter(l=>l.correct).length;
    area.innerHTML = `<div class="done-box">
      <div class="display" style="font-size:18px;margin-bottom:6px;">All 6 answered!</div>
      <div style="font-size:13.5px;">You got <b>${correctCount} / 6</b> matched correctly.</div>
      <button class="primary-btn" onclick="resetAnswers()">Reset &amp; Listen Again</button>
    </div>`;
    return;
  }
  area.innerHTML = `
    <div class="listen-box">
      <div class="listen-label">Listening for</div>
      <div class="listen-q display">Question ${currentQIndex+1} of 6</div>
    </div>
    <div class="answer-pool" id="answerPoolArea"></div>
  `;
  const poolArea = document.getElementById('answerPoolArea');
  remainingAnswers.forEach((opt) => {
    const b = document.createElement('button');
    b.className = 'answer-opt';
    b.textContent = opt.text;
    b.onclick = () => pickAnswer(opt);
    poolArea.appendChild(b);
  });
}

function pickAnswer(opt){
  const correct = (opt.qNum === currentQIndex + 1);
  answerLog.push({ qNum: currentQIndex+1, text: opt.text, correct });
  remainingAnswers = remainingAnswers.filter(o => o !== opt);
  currentQIndex++;
  renderListenArea();
  renderLog();
}

function renderLog(){
  const area = document.getElementById('answerLogArea');
  if(answerLog.length === 0){
    area.innerHTML = `<div style="font-size:13px;color:var(--steel);">Nothing yet — pick an answer once you hear Question 1.</div>`;
    return;
  }
  area.innerHTML = answerLog.map(l => `
    <div class="log-item ${l.correct ? 'correct' : 'incorrect'}">
      <div class="log-num">Q${l.qNum}</div>
      <div>${l.text}</div>
    </div>
  `).join('');
}

function resetAnswers(){
  remainingAnswers = shuffle(answerCorrectOrder.map((text,i)=>({text, qNum:i+1})));
  answerLog = [];
  currentQIndex = 0;
  renderAnswer();
}
</script>
</body>
</html>

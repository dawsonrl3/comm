<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Spy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root{
    --bg:#070b18; --panel:#121a31; --panel2:#1b2646; --line:#2c3b6b; --ink:#eef2ff; --mute:#9ba7d0;
    --neon:#37f2c3; --pink:#ff3d8b; --amber:#ffc24a; --paper:#f1e9d6; --paperink:#2a2418; --ok:#6fe0a4; --bad:#ff6b7d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);
    background-image:radial-gradient(ellipse at 15% -5%, rgba(55,242,195,.10), transparent 50%),radial-gradient(ellipse at 95% 10%, rgba(255,61,139,.10), transparent 45%);
    color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
  .screen{display:none;} .screen.on{display:block;}
  .bng{font-family:Bungee,Impact,sans-serif;font-weight:400;letter-spacing:.02em;}
  button{font-family:inherit;}

  /* ---------- HOME ---------- */
  .hero{position:relative;overflow:hidden;padding:44px 20px 26px;text-align:center;background:linear-gradient(#10183a,#070b18);}
  .hero::before{content:"";position:absolute;left:50%;top:-30px;width:260px;height:340px;transform:translateX(-50%);
    background:conic-gradient(from 160deg at 50% 0, transparent 0 8%, rgba(255,230,160,.17) 12% 28%, transparent 32%);
    animation:sw 6s ease-in-out infinite alternate;transform-origin:50% 0;}
  @keyframes sw{from{transform:translateX(-50%) rotate(-24deg)}to{transform:translateX(-50%) rotate(24deg)}}
  .stampbox{display:inline-block;border:3px solid var(--pink);color:var(--pink);padding:2px 10px;border-radius:6px;font:400 12px Bungee;letter-spacing:.2em;transform:rotate(-4deg);position:relative;}
  h1.mark{position:relative;margin:14px 0 6px;font:400 clamp(38px,12.5vw,58px)/.95 Bungee;color:var(--neon);text-shadow:0 0 30px rgba(55,242,195,.45),0 4px 0 #0b6a56;}
  .hero .eye{position:relative;font-size:64px;margin:6px 0;filter:drop-shadow(0 0 18px rgba(55,242,195,.5));}
  .tag{position:relative;color:var(--mute);font-size:15px;line-height:1.5;max-width:300px;margin:0 auto;}
  .joincard{padding:12px 18px 36px;}
  .fl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--mute);margin:16px 0 8px;}
  input.txt{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 17px Nunito,sans-serif;padding:13px 14px;}
  input.txt:focus{outline:none;border-color:var(--neon);}
  input.code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font:400 26px Bungee;}
  .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .av{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:26px;cursor:pointer;color:inherit;}
  .av.pick{border-color:var(--neon);background:var(--panel2);box-shadow:0 0 16px rgba(55,242,195,.4);}
  .tabs{display:flex;gap:8px;margin-top:20px;}
  .tabbtn{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--mute);font-weight:800;font-size:14px;cursor:pointer;}
  .tabbtn.on{background:var(--panel2);color:var(--ink);border-color:var(--neon);}
  .err{color:#ff9aa6;font-weight:700;font-size:14px;margin:10px 0 0;min-height:1em;}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--neon);color:#042a22;box-shadow:0 5px 0 #17977a;margin-top:16px;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #17977a;}
  .btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:default;}
  .btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #a21a56;}
  .btn.pink:active{box-shadow:0 1px 0 #a21a56;}
  .btn.ghost{background:transparent;color:var(--mute);border:2px solid var(--line);box-shadow:none;}
  .btn.sm{padding:11px 12px;font-size:14px;margin-top:10px;}
  .linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;font:700 13px Nunito,sans-serif;cursor:pointer;padding:8px;}

  /* ---------- WAIT ---------- */
  .wait{padding:30px 18px;text-align:center;}
  .kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--amber);}
  .codebig{font:400 62px Bungee;letter-spacing:.12em;color:var(--neon);text-shadow:0 0 28px rgba(55,242,195,.4);margin:4px 0;}
  .lead{color:var(--mute);font-size:15px;line-height:1.5;margin:0 0 12px;}
  .plist{display:flex;flex-direction:column;gap:10px;margin:18px 0 4px;text-align:left;}
  .prow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;}
  .prow .e{font-size:28px;} .prow small{margin-left:auto;color:var(--mute);font-weight:700;}
  .prow.off{opacity:.4;}
  .seg{display:flex;gap:8px;justify-content:center;margin:6px 0;}
  .seg button{flex:1;max-width:84px;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--mute);font:400 20px Bungee;cursor:pointer;}
  .seg button.on{border-color:var(--neon);color:var(--neon);background:var(--panel2);}

  /* ---------- GAME CHROME ---------- */
  .hud{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;gap:10px;}
  .hud .rd{font:400 15px Bungee;color:var(--amber);line-height:1.1;}
  .hud .rd small{display:block;font:700 11px Nunito;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px;}
  .chipme{border-radius:999px;padding:6px 12px;font:800 13px Nunito;border:2px solid var(--line);background:var(--panel);}
  .chipme.spy{border-color:var(--pink);color:#ffc2da;background:#3a1030;}
  .roster{display:flex;gap:8px;padding:6px 14px 4px;overflow-x:auto;}
  .rp{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;font-weight:800;font-size:13px;}
  .rp .e{font-size:20px;} .rp.me{border-color:var(--neon);} .rp.off{opacity:.4;}
  .rp b{font:400 13px Bungee;color:var(--amber);margin-left:2px;}
  .stage{padding:8px 14px 34px;animation:up .35s ease-out both;}
  @keyframes up{from{opacity:0;transform:translateY(8px)}}
  .step{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--neon);}
  .stage h2{font:400 24px/1.15 Bungee;margin:4px 0 6px;color:var(--ink);}
  .box{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;}
  .box h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
  .tip{background:#2a2410;border:2px solid var(--amber);color:#ffe3a3;border-radius:14px;padding:11px 13px;font-weight:700;font-size:14px;line-height:1.45;margin:12px 0;}
  .tip.sp{background:#38102c;border-color:var(--pink);color:#ffc2da;}
  .wt{color:var(--mute);font-size:14px;font-weight:700;margin-top:12px;text-align:center;}

  /* polaroid with place scene */
  .pol{position:relative;background:var(--paper);padding:9px 9px 12px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 14px 30px rgba(0,0,0,.55);margin:14px 6px 8px;}
  .pol::before{content:"";position:absolute;left:50%;top:-12px;width:84px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(255,194,74,.65);border-radius:2px;}
  .pol .scn{display:block;width:100%;aspect-ratio:360/220;border-radius:3px;overflow:hidden;}
  .pol .scn svg{display:block;width:100%;height:100%;}
  .pol .cap{text-align:center;font:400 22px Bungee;color:var(--paperink);margin-top:10px;}
  .pol .cap small{display:block;font:800 11px Nunito;letter-spacing:.14em;text-transform:uppercase;color:#7a5a2a;margin-top:2px;}
  .secret{position:absolute;right:-8px;top:12px;transform:rotate(8deg);border:3px solid var(--pink);color:var(--pink);background:rgba(241,233,214,.92);padding:1px 8px;border-radius:5px;font:400 12px Bungee;letter-spacing:.15em;}
  .spycard{position:relative;border:3px solid var(--pink);border-radius:18px;padding:22px 14px 16px;text-align:center;overflow:hidden;
    background:repeating-linear-gradient(135deg,#240a20 0 12px,#1d081a 12px 24px);box-shadow:0 0 36px rgba(255,61,139,.35);margin:12px 0;}
  .spycard .big{font-size:64px;filter:drop-shadow(0 0 16px rgba(255,61,139,.7));}
  .spycard .t{font:400 28px Bungee;color:var(--pink);margin:2px 0;text-shadow:0 0 18px rgba(255,61,139,.6);}
  .spycard p{margin:6px 0 0;color:#ffc2da;font-weight:700;font-size:14px;line-height:1.45;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .pc{background:var(--paper);border-radius:10px;padding:5px 5px 8px;border:3px solid transparent;color:var(--paperink);cursor:default;text-align:center;font:inherit;}
  .pc .scn{display:block;aspect-ratio:360/220;border-radius:6px;overflow:hidden;} .pc .scn svg{display:block;width:100%;height:100%;}
  .pc span{display:block;font:400 13px Bungee;margin-top:6px;}
  button.pc{cursor:pointer;} button.pc.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,61,139,.35),0 0 22px rgba(255,61,139,.6);transform:scale(1.02);}
  .pc.x{opacity:.25;}

  /* circle of players */
  .ring{position:relative;aspect-ratio:320/170;margin:6px 0 2px;}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;}
  .rn{position:absolute;transform:translate(-50%,-50%);text-align:center;width:70px;}
  .rn .face{width:46px;height:46px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--panel2);border:3px solid var(--line);}
  .rn.ask .face{border-color:var(--amber);box-shadow:0 0 18px rgba(255,194,74,.7);}
  .rn.ans .face{border-color:var(--neon);box-shadow:0 0 18px rgba(55,242,195,.7);}
  .rn .nm{font-size:12px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rn .rl{font:400 9px Bungee;letter-spacing:.1em;}
  .rn.ask .rl{color:var(--amber);} .rn.ans .rl{color:var(--neon);}
  .dots{display:flex;gap:5px;justify-content:center;margin:2px 0 8px;}
  .dots i{width:10px;height:10px;border-radius:50%;background:#26335c;} .dots i.d{background:var(--neon);} .dots i.n{background:var(--amber);box-shadow:0 0 8px var(--amber);}

  /* question builder */
  .tops{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .tp{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 2px 6px;color:var(--ink);font:800 11px Nunito;cursor:pointer;text-align:center;line-height:1.15;}
  .tp i{display:block;font-style:normal;font-size:22px;margin-bottom:2px;}
  .tp.sel{border-color:var(--amber);box-shadow:0 0 14px rgba(255,194,74,.5);background:#3a3216;}
  .tp:disabled{opacity:.28;cursor:default;}
  .forms{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .fm{text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;color:var(--ink);font:700 15px/1.35 Nunito;cursor:pointer;}
  .fm .tg{display:inline-block;font:400 10px Bungee;letter-spacing:.08em;border-radius:6px;padding:2px 6px;margin-bottom:4px;margin-right:4px;}
  .tg.cl{background:#17406e;color:#a8d4ff;} .tg.op{background:#4b2a6e;color:#e0c2ff;} .tg.ht{background:#5a3b10;color:#ffd493;} .tg.cn{background:#10503f;color:#a8ffe3;}
  .fm.sel{border-color:var(--amber);box-shadow:0 0 14px rgba(255,194,74,.5);}
  .bubble{position:relative;background:var(--paper);color:var(--paperink);border-radius:18px;padding:16px 16px 14px;font:400 19px/1.35 Bungee;margin:10px 0 6px;box-shadow:0 8px 20px rgba(0,0,0,.4);}
  .bubble::after{content:"";position:absolute;left:36px;bottom:-12px;border:12px solid transparent;border-top-color:var(--paper);border-bottom:0;}
  .bubble small{display:block;font:800 11px Nunito;letter-spacing:.12em;text-transform:uppercase;color:#8a5a14;margin-bottom:6px;}
  .stems{display:flex;flex-direction:column;gap:7px;margin:8px 0;}
  .stem{background:var(--panel2);border:2px dashed var(--neon);border-radius:12px;padding:9px 12px;font-weight:800;font-size:15px;color:#d8fff4;line-height:1.35;}
  .stem.sp{border-color:var(--pink);color:#ffd5e6;}
  .stem.gr{border-color:var(--line);color:var(--mute);border-style:solid;font-weight:700;}
  .minis{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .mini{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--mute);}
  details.log{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0;}
  details.log summary{font:800 12px Nunito;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer;}
  details.log ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.5;color:var(--ink);}
  .badge{display:flex;gap:8px;margin:6px 0 0;font-size:12px;font-weight:800;}
  .badge span{border:1.5px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mute);}
  .badge span.on{border-color:var(--ok);color:var(--ok);}

  /* vote */
  .vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .vb{border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px 8px;color:var(--ink);font:800 15px Nunito;cursor:pointer;text-align:center;}
  .vb i{display:block;font-style:normal;font-size:38px;margin-bottom:4px;}
  .vb.sel{border-color:var(--pink);box-shadow:0 0 20px rgba(255,61,139,.6);background:#35123a;}
  .vb:disabled{cursor:default;opacity:.8;}

  /* reveal */
  .stamp{display:inline-block;font:400 30px Bungee;border:5px solid;padding:2px 14px;border-radius:10px;transform:rotate(-6deg);animation:stp .5s cubic-bezier(.2,1.8,.4,1) both;letter-spacing:.04em;}
  .stamp.g{color:var(--ok);border-color:var(--ok);text-shadow:0 0 18px rgba(111,224,164,.5);}
  .stamp.s{color:var(--pink);border-color:var(--pink);text-shadow:0 0 18px rgba(255,61,139,.5);}
  @keyframes stp{from{transform:rotate(-6deg) scale(3);opacity:0}}
  .tally{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .tally span{background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800;}
  .tally span.hit{background:#16402f;color:var(--ok);}
  .score{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-weight:800;}
  .score:first-of-type{border-top:0;} .score .e{font-size:24px;} .score .pt{margin-left:auto;font:400 18px Bungee;color:var(--amber);}
  .score .dl{font:400 13px Bungee;color:var(--ok);} .score .dl.z{color:var(--mute);}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:20px 0 6px;}
  .pd{flex:1;max-width:110px;text-align:center;}
  .pd .face{font-size:34px;} .pd .nm{font-weight:800;font-size:13px;margin:2px 0 4px;}
  .pd .bar{border-radius:10px 10px 0 0;font:400 28px Bungee;padding:10px 0 12px;color:#06121f;}
  .pd.p1 .bar{background:linear-gradient(#ffd75e,#e1a216);height:120px;} .pd.p2 .bar{background:linear-gradient(#dfe6f2,#9eabc4);height:90px;} .pd.p3 .bar{background:linear-gradient(#e9a36a,#b06a33);height:70px;}
  .pd .pts{font:800 12px Nunito;color:#06121f;opacity:.7;display:block;margin-top:2px;}
  .conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
  .conf i{position:absolute;top:-14px;width:9px;height:14px;opacity:.9;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .flashbg{position:fixed;inset:0;background:var(--pink);opacity:0;pointer-events:none;z-index:39;animation:fl 1.2s ease-out 1;}
  @keyframes fl{0%{opacity:.4}30%{opacity:.02}50%{opacity:.35}100%{opacity:0}}

  .guessbtn{display:block;width:100%;margin-top:18px;border:2px dashed var(--pink);background:rgba(255,61,139,.08);color:#ffc2da;border-radius:14px;padding:13px;font:800 15px Nunito;cursor:pointer;}
  .ov{position:fixed;inset:0;z-index:30;background:rgba(5,7,16,.94);overflow-y:auto;padding:18px 14px 30px;}
  .ovi{max-width:480px;margin:0 auto;}
  .ref{background:var(--panel);border:2px solid var(--pink);border-radius:16px;padding:10px 10px 8px;margin:10px 0;}
  .ref h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffc2da;}
  .rg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .rc{background:var(--paper);border:0;border-radius:8px;padding:3px 3px 4px;color:var(--paperink);cursor:pointer;font:inherit;position:relative;}
  .rc .scn{display:block;aspect-ratio:360/220;border-radius:5px;overflow:hidden;} .rc .scn svg{display:block;width:100%;height:100%;}
  .rc span{display:block;font:800 10px/1.15 Nunito;margin-top:3px;text-align:center;}
  .rc.x{opacity:.3;filter:grayscale(1);} .rc.x span{text-decoration:line-through;}
  .refbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;margin:6px 0 10px;}
  .refbar .scn{flex:0 0 92px;aspect-ratio:360/220;border-radius:6px;overflow:hidden;} .refbar .scn svg{display:block;width:100%;height:100%;}
  .refbar small{display:block;font:800 10px Nunito;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);} .refbar b{font:400 18px Bungee;color:var(--amber);}
  .steam{animation:stm 3.2s ease-in-out infinite;} @keyframes stm{0%,100%{opacity:.15;transform:translateY(3px)}50%{opacity:.6;transform:translateY(-4px)}}
  .flick{animation:fk 2.6s ease-in-out infinite;} @keyframes fk{0%,100%{opacity:.95}45%{opacity:.7}60%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
</head>
<body>
<div id="app">

  <section id="s-home" class="screen on">
    <div class="hero">
      <span class="stampbox">TOP SECRET</span>
      <div class="eye">🕵️</div>
      <h1 class="mark">SPOT THE<br>SPY</h1>
      <p class="tag">Everyone knows the secret place… except one spy. Ask. Answer. Find the spy!</p>
    </div>
    <div class="joincard">
      <div class="fl">Your name</div>
      <input class="txt" id="inName" maxlength="12" placeholder="Name" autocomplete="off">
      <div class="fl">Pick your agent</div>
      <div class="avs" id="avGrid"></div>
      <div class="tabs">
        <button class="tabbtn on" id="tabCreate" type="button">Create a room</button>
        <button class="tabbtn" id="tabJoin" type="button">Join a room</button>
      </div>
      <div id="joinBox" style="display:none">
        <div class="fl">Room code from your group</div>
        <input class="txt code" id="inCode" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="err" id="homeErr"></div>
      <button class="btn" id="goBtn" type="button">Create room</button>
    </div>
  </section>

  <section id="s-wait" class="screen">
    <div class="wait">
      <div class="kick">Room code</div>
      <div class="codebig" id="waitCode"></div>
      <p class="lead">Your group (3 to 6 players): open this page, tap “Join a room”, and type this code.</p>
      <div class="plist" id="waitList"></div>
      <div class="err" id="waitErr"></div>
      <button class="btn" id="startBtn" type="button">Start the game</button>
      <div class="wt" id="waitMsg"></div>
      <button class="linkbtn" id="leaveWait" type="button">Leave room</button>
    </div>
  </section>

  <section id="s-game" class="screen">
    <div class="hud"><div class="rd" id="hudRd"></div><div id="hudMe"></div></div>
    <div class="roster" id="roster"></div>
    <div class="stage" id="stage"></div>
    <div style="text-align:center"><button class="linkbtn" id="leaveGame" type="button">Leave room</button></div>
  </section>
</div>
<div id="ovWrap"></div>
<div id="fxWrap"></div>

<script>
/* =====================================================================
   FIREBASE (same project as your other games; own path "spy-game")
   ===================================================================== */
const firebaseConfig = {

/* =====================================================================
   PURE GAME LOGIC  (runs inside Firebase transactions)
   ===================================================================== */
const clone=o=>JSON.parse(JSON.stringify(o));
function playersOf(s){
  const src=s&&s.players?s.players:{};
  const arr=Array.isArray(src)?src.map((p,i)=>p&&Object.assign({id:String(i)},p)).filter(Boolean):Object.keys(src).map(id=>Object.assign({id},src[id]));
  return arr.sort((a,b)=>(a.joined||0)-(b.joined||0)||(a.id<b.id?-1:1));
}
const onlineOf=s=>playersOf(s).filter(p=>p.online!==false);
function strip(s,...keys){ Object.keys(s.players||{}).forEach(id=>keys.forEach(k=>{delete s.players[id][k];})); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const pick=a=>a[Math.floor(Math.random()*a.length)];

function newRound(nx){
  const ps=onlineOf(nx);
  nx.round=(nx.round||0)+1;
  const used=nx.usedPlaces||{};
  let pool=PLACES.filter(p=>!used[p.id]); if(!pool.length){ pool=PLACES.slice(); nx.usedPlaces={}; }
  const place=pick(pool);
  nx.usedPlaces=Object.assign({},nx.usedPlaces||{},{[place.id]:true});
  nx.place=place.id;
  nx.spy=pick(ps).id;                       /* uniformly random every round */
  const others=Object.keys(CLUSTERS).filter(c=>c!==place.c);
  const other=pick(others);
  nx.cand=shuffle(PLACES.filter(p=>p.c===place.c||p.c===other).map(p=>p.id));   /* 8 cards for the spy */
  nx.order=shuffle(ps.map(p=>p.id));
  nx.total=ps.length*(ps.length<=4?2:1);
  nx.turn=0; nx.sub='ask'; nx.q=null; nx.usedT=null; nx.log=null; nx.result=null;
  nx.phase='role';
  strip(nx,'ready','vote','kc','ko','delta');
  return nx;
}
function advanceTurn(nx){
  nx.turn=(nx.turn||0)+1; nx.q=null; nx.sub='ask';
  if(nx.turn>=nx.total){ nx.phase='vote'; strip(nx,'ready','vote'); }
  return nx;
}
function finish(nx,how){
  const ids=nx.order.filter(id=>(nx.players||{})[id]);
  const spy=nx.spy, others=ids.filter(id=>id!==spy), d={};
  ids.forEach(id=>{ d[id]=0; });
  if(how==='caught') others.forEach(id=>{ d[id]=2; });
  else{ d[spy]=3; others.forEach(id=>{ if(nx.players[id].vote===spy) d[id]+=1; }); }
  ids.forEach(id=>{ const p=nx.players[id]; p.delta=d[id]; p.score=(p.score||0)+d[id]; });
  nx.result={how, spyWin:how!=='caught'};
  nx.phase='reveal'; strip(nx,'ready');
  return nx;
}
/* only the agents (everyone except the spy) vote */
const votersOf=s=>onlineOf(s).filter(p=>p.id!==s.spy&&(s.order||[]).includes(p.id));
function resolveVote(nx){
  const v=votersOf(nx);
  const unanimous=v.length>0&&v.every(p=>p.vote===nx.spy);
  return finish(nx,unanimous?'caught':'uncaught');
}
function reduce(cur,a){
  if(!cur) return null;
  const nx=clone(cur);
  switch(a.t){
    case 'start': {
      if(cur.phase!=='lobby'&&cur.phase!=='final') return null;
      const n=onlineOf(cur).length; if(n<MIN_P||n>MAX_P) return null;
      nx.round=0; nx.usedPlaces={};
      Object.keys(nx.players).forEach(id=>{ nx.players[id].score=0; });
      return newRound(nx);
    }
    case 'ask': {
      if(cur.phase!=='turns'||cur.sub!=='ask') return null;
      const asker=cur.order[cur.turn%cur.order.length], to=cur.order[(cur.turn+1)%cur.order.length];
      if(a.by!==asker||(cur.usedT||{})[a.topic]) return null;
      const T=TOPICS.find(t=>t.id===a.topic); if(!T||!T[a.form]) return null;
      nx.q={topic:a.topic,form:a.form,text:T[a.form],by:asker,to};
      nx.usedT=Object.assign({},cur.usedT||{},{[a.topic]:true});
      nx.players[asker][isClosed(a.form)?'kc':'ko']=true;
      nx.sub='answer'; return nx;
    }
    case 'done': {
      if(cur.phase!=='turns'||cur.sub!=='answer'||a.by!==cur.q.to) return null;
      return advanceTurn(nx);
    }
  }
  return null;
}
function auto(cur){
  if(!cur||!cur.phase) return null;
  const ps=onlineOf(cur); if(!ps.length) return null;
  const nx=clone(cur);
  if(cur.phase==='role'){ if(!ps.every(p=>p.ready)) return null; nx.phase='turns'; strip(nx,'ready'); return nx; }
  if(cur.phase==='turns'){
    const asker=cur.order[cur.turn%cur.order.length], to=cur.order[(cur.turn+1)%cur.order.length];
    const on=id=>{const p=(cur.players||{})[id];return p&&p.online!==false;};
    if(cur.sub==='ask'&&!on(asker)) return advanceTurn(nx);
    if(cur.sub==='answer'&&!on(to)) return advanceTurn(nx);
    return null;
  }
  if(cur.phase==='vote'){ const v=votersOf(cur); if(!v.length||!v.every(p=>p.vote)) return null; return resolveVote(nx); }
  if(cur.phase==='reveal'){
    if(!ps.every(p=>p.ready)) return null;
    strip(nx,'ready');
    if(cur.round>=ROUNDS){ nx.phase='final'; return nx; }
    return newRound(nx);
  }
  return null;
}

    if(S.sub==='ask'){
      if(iAsk){
        const used=S.usedT||{}, mm=m||{};
        h+=`<div class="step">Your turn · ask ${esc(nameOf(to))}</div><h2>Choose a question</h2>
          <div class="box"><h3>1 · Pick a topic</h3><div class="tops">`+TOPICS.map(t=>`<button type="button" class="tp ${L.topic===t.id?'sel':''}" data-a="topic" data-v="${t.id}" ${used[t.id]?'disabled':''}><i>${t.icon}</i>${esc(t.label)}</button>`).join('')+`</div>`;
        if(L.topic){
          const T=TOPICS.find(t=>t.id===L.topic);
          h+=`<h3 style="margin-top:14px">2 · Pick a question</h3><div class="forms">`+FORM_ORDER.map(f=>`<button type="button" class="fm ${L.form===f?'sel':''}" data-a="form" data-v="${f}">${FORMS[f].tags.map(t=>`<span class="tg ${t[1]}">${esc(t[0])}</span>`).join('')}<br>${esc(T[f])}</button>`).join('')+`</div>`;
        }
        h+=`</div>`;
        if(L.topic&&L.form){
          h+=`<div class="bubble"><small>Ask ${esc(nameOf(to))} out loud</small>${esc(TOPICS.find(t=>t.id===L.topic)[L.form])}</div>
              <button class="btn" type="button" data-a="ask">I asked ${esc(nameOf(to))}</button>`;
        }
        h+=`<div class="badge"><span class="${mm.kc?'on':''}">${mm.kc?'✔':'○'} Yes/No question</span><span class="${mm.ko?'on':''}">${mm.ko?'✔':'○'} Wh- question</span></div>
            <div class="wt" style="text-align:left">Try both kinds this round!</div>`;
      }else{
        h+=`<div class="step">Listen</div><h2>${esc(nameOf(asker))} is choosing a question…</h2>
            <p class="lead">${iAns?'Get ready to answer! Listen carefully. You will not see the question on your phone.':'Listen carefully. Does everybody sound like they know the place?'}</p>`;
      }
    }else{
      const q=S.q;
      if(iAns){
        h+=`<div class="step" style="margin-top:14px">Your turn · answer</div><div style="font-size:54px;text-align:center;margin-top:4px">👂</div><h2 style="text-align:center">Listen carefully!</h2>
            <p class="lead" style="text-align:center">${esc(nameOf(q.by))} is asking you a question. Your phone does not show it. Listen, then answer.</p>
            ${minis(['Sorry?','Could you say that again?','Pardon?'])}
            <div class="box"><h3>Yes / No questions</h3>${stemsHtml(ANS_YN)}<h3 style="margin-top:12px">Wh- questions</h3>${stemsHtml(ANS_WH)}</div>
            <div class="tip">${isSpy()?'You are the spy! Give a general answer that fits many places.':'Answer clearly, but don’t give the place away.'} Then tap the button.</div>
            <button class="btn" type="button" data-a="done">I answered</button>`;
      }else{
        h+=`<div class="bubble"><small>${esc(nameOf(q.by))} asks ${esc(nameOf(q.to))}</small>${esc(q.text)}</div>
            <div class="step" style="margin-top:14px">Listen</div><h2>${esc(nameOf(q.to))} is answering…</h2>
            <p class="lead">Listen. Then think: “Does ${esc(nameOf(q.to))} know the place?”</p>
            ${minis(['Really?','That’s interesting.','Me too.','I agree.','Hmm, are you sure?'])}`;
      }
    }
  }

  else if(ph==='vote'){
    h+=refHtml();
    if(isSpy()){
      h+=`<div class="step" style="margin-top:14px;color:var(--pink)">Stay calm…</div><h2>Your friends are voting</h2>
        <div class="spycard"><div class="big">😎</div><div class="t">ACT NATURAL</div><p>If all of them choose you, you lose! Talk to your friends and sound sure.</p></div>
        ${stemsHtml(['I think it’s ___ because ___ .','Why do you think so?','I agree with you.','Maybe, but I’m not sure.'],'sp')}`;
      h+=voteCount();
    }else{
      h+=`<div class="step" style="margin-top:14px">Time to vote</div><h2>Who is the spy?</h2>
        <p class="lead">Talk! You must all choose the same person to catch the spy.</p>
        ${stemsHtml(['I think ___ is the spy because ___ .','___ didn’t sound sure.','Maybe, but I think ___ .'])}`;
      const voted=!!(m&&m.vote);
      h+=`<div class="vg">`+players().filter(p=>p.id!==L.pid&&S.order.includes(p.id)).map(p=>{
        const sel=voted?m.vote===p.id:L.votePick===p.id;
        return `<button type="button" class="vb ${sel?'sel':''}" data-a="vpick" data-v="${p.id}" ${voted?'disabled':''}><i>${esc(p.avatar)}</i>${esc(p.name)}</button>`;}).join('')+`</div>`;
      if(!voted) h+=`<button class="btn pink" type="button" data-a="lock" ${L.votePick?'':'disabled'}>🗳️ Lock in my vote</button>`;
      else h+=voteCount()+`<button class="btn ghost sm" type="button" data-a="unvote">Change my vote</button>`;
    }
  }

  else if(ph==='reveal'){
    const r=S.result||{}, caught=r.how==='caught';
    h+=`<div style="text-align:center;margin:6px 0 2px"><span class="stamp ${r.spyWin?'s':'g'}">${r.spyWin?'SPY WINS':'GROUP WINS'}</span></div>
        <h2 style="text-align:center;font-size:19px">${caught?'Everyone chose the spy!':'The spy got away!'}</h2>
        <p class="lead" style="text-align:center">${caught?'The agents all voted for the same person, and it was right.':'The agents did not all choose the spy.'}</p>
        ${polaroid(S.place,'The secret place')}
        <div class="box" style="text-align:center"><h3>The spy was</h3><div style="font-size:44px">${esc(avOf(S.spy))}</div><div class="bng" style="font-size:20px;color:var(--pink)">${esc(nameOf(S.spy))}</div></div>
        <div class="box"><h3>Votes</h3><div class="tally">`+S.order.filter(id=>id!==S.spy).map(id=>{ const v=(pById(id)||{}).vote; return v?`<span class="${v===S.spy?'hit':''}">${esc(avOf(id))} ➜ ${esc(avOf(v))} ${esc(nameOf(v))}</span>`:''; }).join('')+`</div></div>
        <div class="box"><h3>Points</h3>`+players().filter(p=>S.order.includes(p.id)).sort((a,b)=>(b.score||0)-(a.score||0)).map(p=>`<div class="score"><span class="e">${esc(p.avatar)}</span>${esc(p.name)}${p.id===S.spy?' 🕵️':''}<span class="dl ${p.delta?'':'z'}">${p.delta?'+'+p.delta:'+0'}</span><span class="pt">${p.score||0}</span></div>`).join('')+`</div>`;
    const last=S.round>=ROUNDS;
    h+= m&&m.ready?waitingOn('ready'):`<button class="btn" type="button" data-a="ready">${last?'See final scores':'Next round'}</button>`;
  }

  else if(ph==='final'){
    const ranked=players().slice().sort((a,b)=>(b.score||0)-(a.score||0));
    const pod=[ranked[1],ranked[0],ranked[2]].filter(Boolean);
    const cls=p=>ranked.indexOf(p)===0?'p1':ranked.indexOf(p)===1?'p2':'p3';
    h+=`<div class="step" style="text-align:center">Game over</div><h2 style="text-align:center">Top agent: ${esc(ranked[0].name)}!</h2>
        <div class="podium">`+pod.map(p=>`<div class="pd ${cls(p)}"><div class="face">${esc(p.avatar)}</div><div class="nm">${esc(p.name)}</div><div class="bar">${ranked.indexOf(p)+1}<span class="pts">${p.score||0} pts</span></div></div>`).join('')+`</div>
        <div class="box"><h3>All scores</h3>`+ranked.map(p=>`<div class="score"><span class="e">${esc(p.avatar)}</span>${esc(p.name)}<span class="pt">${p.score||0}</span></div>`).join('')+`</div>
        <div class="box"><h3>Talk about it</h3><p class="lead" style="margin:0;color:var(--ink)">Which place was the hardest for the spy? Which question gave the place away? What do you have to do and can’t do in your favorite place?</p></div>
        <button class="btn" type="button" data-a="again">Play again</button>`;
  }
  P.innerHTML=h;
  P.style.animation='none'; void P.offsetWidth; P.style.animation='';
}

/* ---------- celebratory effects ---------- */
function renderFx(){
  const k=S.phase+':'+S.round;
  if(L.fxKey===k) return; L.fxKey=k;
  const w=$('fxWrap'); w.innerHTML='';
  if(S.phase==='reveal'&&S.result){
    if(S.result.spyWin){ w.innerHTML='<div class="flashbg"></div>'; }
    else{ w.innerHTML='<div class="conf">'+range(36).map(i=>`<i style="left:${Math.random()*100}%;background:${['#37f2c3','#ffc24a','#ff3d8b','#7a8cff','#fff'][i%5]};animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*.6}s"></i>`).join('')+'</div>'; }
    setTimeout(()=>{ if($('fxWrap')) $('fxWrap').innerHTML=''; },4800);
  }
  if(S.phase==='final'){
    w.innerHTML='<div class="conf">'+range(50).map(i=>`<i style="left:${Math.random()*100}%;background:${['#37f2c3','#ffc24a','#ff3d8b','#7a8cff','#fff'][i%5]};animation-duration:${2.4+Math.random()*2.4}s;animation-delay:${Math.random()*.8}s"></i>`).join('')+'</div>';
    setTimeout(()=>{ if($('fxWrap')) $('fxWrap').innerHTML=''; },5600);
  }
}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||!S) return;
  const a=b.dataset.a, v=b.dataset.v;
  switch(a){
    case 'ready': setFlag('ready',true); break;
    case 'topic': if(L.topic===v){ L.topic=null; L.form=null; } else { L.topic=v; L.form=null; } render(); break;
    case 'form': L.form=v; render(); break;
    case 'ask': if(L.topic&&L.form) act({t:'ask',topic:L.topic,form:L.form}); break;
    case 'done': act({t:'done'}); break;
    case 'vpick': L.votePick=v; render(); break;
    case 'lock': if(L.votePick) setFlag('vote',L.votePick); break;
    case 'unvote': L.ref.child('players/'+L.pid+'/vote').remove(); break;
    case 'cross': L.cross=L.cross||{}; L.cross[v]=!L.cross[v]; render(); break;
    case 'again': act({t:'start'}); break;
  }
});
</script>
</body>
</html>
